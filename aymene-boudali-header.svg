<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Aymene Boudali — Software Developer</title>
  <desc id="desc">Dark header with a soft green glow and gentle animated waves. Aymene Boudali, AI, machine learning and software development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#06161a"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="1200" height="240" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="240" fill="url(#bg)"/>

    <!-- soft glow -->
    <ellipse cx="600" cy="70" rx="420" ry="130" fill="url(#glow)">
      <animate attributeName="rx" values="420;480;420" dur="10s" repeatCount="indefinite"/>
    </ellipse>

    <!-- waves (kept below the text) -->
    <path fill="url(#wave2)" d="M0 204 C300 184 500 224 800 202 S1100 190 1200 200 L1200 240 L0 240 Z">
      <animate attributeName="d" dur="11s" repeatCount="indefinite" values="
        M0 204 C300 184 500 224 800 202 S1100 190 1200 200 L1200 240 L0 240 Z;
        M0 198 C300 220 500 188 800 206 S1100 220 1200 202 L1200 240 L0 240 Z;
        M0 204 C300 184 500 224 800 202 S1100 190 1200 200 L1200 240 L0 240 Z"/>
    </path>
    <path fill="url(#wave1)" d="M0 216 C250 200 450 232 700 214 S1050 204 1200 214 L1200 240 L0 240 Z">
      <animate attributeName="d" dur="8s" repeatCount="indefinite" values="
        M0 216 C250 200 450 232 700 214 S1050 204 1200 214 L1200 240 L0 240 Z;
        M0 212 C250 230 450 204 700 218 S1050 230 1200 212 L1200 240 L0 240 Z;
        M0 216 C250 200 450 232 700 214 S1050 204 1200 214 L1200 240 L0 240 Z"/>
    </path>

    <!-- text -->
    <g font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="middle">
      <text x="600" y="108" fill="#ffffff" font-size="52" font-weight="700" letter-spacing="-1">Aymene Boudali</text>
      <rect x="500" y="126" width="200" height="2" fill="url(#rule)"/>
      <text x="600" y="160" fill="#bff5e0" font-size="16" font-weight="500" letter-spacing="3">AI  ·  MACHINE LEARNING  ·  SOFTWARE</text>
    </g>
  </g>
</svg>
