<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Aymene Boudali — Software Developer</title>
  <desc id="desc">Animated waving dark gradient header for a GitHub profile, highlighting AI, machine learning, web, Android, and desktop development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="50%" stop-color="#003322"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f5a0" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#7afbd0" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="clip">
      <rect width="1200" height="240" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="240" fill="#050810"/>
    <ellipse cx="880" cy="30" rx="350" ry="170" fill="#00f5a0" opacity=".17" filter="url(#softGlow)">
      <animate attributeName="cx" values="880;980;880;780;880" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M0 156 C170 115 260 205 430 166 S700 115 860 156 S1080 205 1200 140 L1200 240 L0 240 Z" fill="url(#bg)" opacity=".95">
      <animate attributeName="d" dur="9s" repeatCount="indefinite" values="M0 156 C170 115 260 205 430 166 S700 115 860 156 S1080 205 1200 140 L1200 240 L0 240 Z;M0 145 C170 195 260 115 430 150 S700 195 860 145 S1080 115 1200 160 L1200 240 L0 240 Z;M0 156 C170 115 260 205 430 166 S700 115 860 156 S1080 205 1200 140 L1200 240 L0 240 Z"/>
    </path>
    <path d="M0 188 C200 160 310 218 500 185 S800 160 980 190 S1110 190 1200 175 L1200 240 L0 240 Z" fill="#00f5a0" opacity=".12"/>
    <path d="M0 202 C200 174 310 232 500 199 S800 174 980 204 S1110 204 1200 189" fill="none" stroke="url(#glow)" stroke-width="2"/>
    <g fill="#b7ffe7" opacity=".65">
      <circle cx="100" cy="48" r="1.8"/><circle cx="180" cy="80" r="1.2"/><circle cx="1040" cy="58" r="1.7"/><circle cx="1100" cy="104" r="1.2"/><circle cx="950" cy="32" r="1.3"/><circle cx="740" cy="48" r="1.2"/><circle cx="310" cy="36" r="1.4"/>
    </g>
    <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
      <text x="600" y="102" fill="#ffffff" font-size="49" font-weight="750" letter-spacing="-.8">Aymene Boudali</text>
      <rect x="520" y="119" width="160" height="2" rx="1" fill="#00f5a0" opacity=".9"/>
      <text x="600" y="151" fill="#e8fff6" font-size="17" font-weight="500" letter-spacing="2.2">AI  ·  MACHINE LEARNING  ·  SOFTWARE</text>
      <text x="600" y="178" fill="#c5e8dc" font-size="14" letter-spacing="1.4">WEB  /  ANDROID  /  DESKTOP DEVELOPMENT</text>
    </g>
    <g fill="none" stroke="#75ffd0" stroke-opacity=".25">
      <circle cx="90" cy="120" r="34"/><circle cx="90" cy="120" r="48" stroke-dasharray="3 8"/>
      <circle cx="1110" cy="122" r="34"/><circle cx="1110" cy="122" r="48" stroke-dasharray="3 8"/>
    </g>
    <path d="M0 0 H1200 V4 H0 Z" fill="#00f5a0" opacity=".55"/>
  </g>
</svg>
